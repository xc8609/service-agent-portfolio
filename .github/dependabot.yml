version: 2
# One grouped pull request per ecosystem per week. Updates that CI cannot validate, or
# that change an architectural or fixture decision, are ignored here and made by hand.
# Completed analytics cases (complaint, retail, Winnipeg 311) are not version-updated:
# CI does not install their dependencies, so a green check would not prove their
# results are unchanged. The weekly pip-audit still covers them for advisories.
updates:
  # Offline tooling stays Python 3.9 compatible.
  - package-ecosystem: pip
    directories:
      - /
      - /projects/bank-service-assist
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    ignore:
      # Releases that dropped Python 3.9.
      - dependency-name: pytest
        update-types: [version-update:semver-major]
      - dependency-name: jsonschema
        versions: ['>=4.26']
      - dependency-name: duckdb
        update-types: [version-update:semver-major]
      # Pinned to the business-calendar fixture; change both together by hand.
      - dependency-name: tzdata
    groups:
      offline-tooling:
        patterns: ['*']
  # Application runtimes run on Python 3.12.
  - package-ecosystem: pip
    directories:
      - /services/api
      - /projects/investment-research
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    groups:
      application-runtime:
        patterns: ['*']
  - package-ecosystem: npm
    directories:
      - /apps/web
      - /projects/investment-research/web
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    groups:
      web:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
  # Runtime versions are architecture decisions: patch updates only.
  - package-ecosystem: docker
    directories:
      - /
      - /projects/investment-research
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major, version-update:semver-minor]
    groups:
      base-images:
        patterns: ['*']
