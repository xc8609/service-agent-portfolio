name: Bank runtime
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    name: Bank API + browser (PostgreSQL 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_DB: bank_demo_ci
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bank_demo_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      BANK_TEST_ADMIN_URL: postgresql://postgres:ci-disposable-only@127.0.0.1:5432/bank_demo_ci
      PYTHONPATH: services/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24.19.0', cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: python -m pip install -r services/api/requirements.lock
      - run: ruff check services/api && ruff format --check services/api
      - run: python -m pytest -c services/api/pytest.ini services/api/tests -q
      - name: Bound Ubuntu dependency downloads
        run: |
          # The hosted runner's Azure mirror stalled on two independent runs.
          # Keep Ubuntu signature verification; use its official archive instead.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo tee /etc/apt/apt.conf.d/99-bank-ci-downloads >/dev/null <<'EOF'
          Acquire::Retries "2";
          Acquire::http::Timeout "30";
          Acquire::https::Timeout "30";
          EOF
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Start isolated demo API
        run: |
          python services/api/ci_serve.py > /tmp/bank-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: python scripts/smoke_demo.py
      - run: npm run test:e2e
        working-directory: apps/web
      - name: Preserve failed browser evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
  container:
    name: Bank container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - run: python3 scripts/configure_demo.py
      - run: docker compose up --build --wait --wait-timeout 180
      - run: python3 scripts/smoke_demo.py
      - name: Record image and database versions
        run: |
          docker image inspect bank-service-local:dev --format '{{.Id}}'
          docker compose exec -T db psql -U postgres -d bank_demo_compose -c 'select version();'
      - name: Stop disposable CI stack
        if: always()
        run: docker compose down
