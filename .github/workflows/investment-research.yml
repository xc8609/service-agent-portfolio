name: Investment research
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    name: Investment API + browser + container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/investment-research
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.12'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24.19.0', cache: npm, cache-dependency-path: projects/investment-research/web/package-lock.json}
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check api src && ruff format --check api
      - run: python -m pytest
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: projects/investment-research/web
      - name: Start standalone research API
        run: |
          PYTHONPATH=api:src python -m uvicorn research_api.app:create_app --factory --host 127.0.0.1 --port 8010 > /tmp/research-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8010/health/live; then exit 0; fi
            sleep 1
          done
          cat /tmp/research-api.log
          exit 1
      - run: npm run test:e2e
        working-directory: projects/investment-research/web
      - name: Verify independent container
        run: |
          docker build -t investment-research:ci .
          docker run -d --name investment-research-ci -p 127.0.0.1:8011:8010 investment-research:ci
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8011/health/live; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8011/ | grep -q '<div id="root"></div>'
          curl --fail --silent http://127.0.0.1:8011/v1/research/sources/msft-ar2025/comparison > /tmp/research-container.json
          python -c "import json; r=json.load(open('/tmp/research-container.json')); assert r['metrics']['revenue']['growth_pct']['value']=='14.93'; assert len(r['facts'])==6; assert not r['gaps']"
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen
          comparison = json.load(open('/tmp/research-container.json'))
          body = json.dumps({'source_id': 'msft-ar2025', 'question': 'What changed in operating cash flow?', 'expected_source_hash': comparison['source']['sha256']}).encode()
          request = Request('http://127.0.0.1:8011/v1/research/runs', data=body, headers={'Content-Type': 'application/json'})
          with urlopen(request) as response:
              draft = json.load(response)
          assert draft['status'] == 'draft', draft
          assert any(item['kind'] == 'reported_explanation' for item in draft['findings']), draft
          assert len(draft['trace']) == 4, draft
          PY
      - name: Preserve failed browser evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: projects/investment-research/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop CI container
        if: always()
        run: docker rm -f investment-research-ci || true
